name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to least-privilege. Individual jobs can opt up if they need write
# access (e.g. publishing). Dependabot keeps the pinned action versions
# below current — see .github/dependabot.yml.
permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # No explicit version — action reads packageManager field from package.json
      # so CI always installs the exact pnpm revision the repo was tested with.
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint packages
        run: pnpm --filter "@symplek/*" --filter "create-symplek" run lint
      - name: Type check packages
        run: pnpm --filter "@symplek/*" --filter "create-symplek" run typecheck

  tier-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fail if @symplek/core imports @symplek/pro
        run: |
          # Match only actual import/require statements, not comments or prose.
          # Previous grep for bare '@symplek/pro' false-positived on comment text.
          matches=$(grep -rEl "from ['\"]@symplek/pro" packages/symplek-core/src --include='*.ts' || true)
          if [ -n "$matches" ]; then
            echo "Error: @symplek/core must not import @symplek/pro. Offending files:"
            echo "$matches"
            exit 1
          fi
          echo "OK: no @symplek/pro imports in packages/symplek-core/src"

  build:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm --filter "@symplek/*" --filter "create-symplek" run build
      - name: Check build artefacts present
        run: |
          for package in @symplek/core @symplek/convex @symplek/react @symplek/pro @symplek/mcp @symplek/harness @symplek/testing; do
            if [ ! -d "packages/$package/dist" ]; then
              echo "Error: packages/$package/dist not found"
              exit 1
            fi
          done
          # @symplek/cli builds via `tsc && copy-templates`; its entry is dist/index.js.
          if [ ! -f "packages/symplek-cli/dist/index.js" ]; then
            echo "Error: packages/symplek-cli/dist/index.js not found"
            exit 1
          fi
          # create-symplek builds to dist/index.js (CJS bundle).
          if [ ! -f "packages/create-symplek/dist/index.js" ]; then
            echo "Error: packages/create-symplek/dist/index.js not found"
            exit 1
          fi
          echo "OK: all published packages emitted their build artefacts"
      - name: Inspect packed @symplek/pro for unresolved workspace specifiers
        working-directory: packages/symplek-pro
        run: |
          # `peerDependencies.symplek-core` is `workspace:*` in source; `pnpm pack`
          # (and `changeset publish`) rewrites it to a real semver range. A raw
          # `npm publish` would ship the unresolvable `workspace:` literal.
          # Assert the rewrite worked. `pnpm pack` is non-recursive, so it must
          # run from the package directory (no --filter).
          set -euo pipefail
          work_dir="$(mktemp -d)"
          pnpm pack --pack-destination "$work_dir"
          tarball="$(ls "$work_dir"/*.tgz)"
          echo "Inspecting packed tarball: $tarball"
          tar -xzf "$tarball" -C "$work_dir"
          packed_pkg="$work_dir/package/package.json"
          if grep -q 'workspace:' "$packed_pkg"; then
            echo "Error: packed @symplek/pro package.json still contains a 'workspace:' specifier:"
            grep -n 'workspace:' "$packed_pkg"
            exit 1
          fi
          echo "OK: packed @symplek/pro package.json has no 'workspace:' specifiers"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm --filter "@symplek/*" --filter "create-symplek" run build
      - name: Test packages
        run: pnpm --filter "@symplek/*" test

  # Gated publish via the changesets flow. Runs ONLY on push to main, after all
  # quality gates pass. On a normal push it opens/updates a "Version Packages" PR;
  # when that PR merges (consuming the changesets), it runs `release` and publishes.
  # GITHUB_TOKEN is auto-provided; NPM_TOKEN must be set as a repo secret for publish.
  release:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, tier-boundary, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create release PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
