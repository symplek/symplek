name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to least-privilege. Individual jobs can opt up if they need write
# access (e.g. publishing). Dependabot keeps the pinned action versions
# below current — see .github/dependabot.yml.
permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # No explicit version — action reads packageManager field from package.json
      # so CI always installs the exact pnpm revision the repo was tested with.
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint packages
        run: pnpm --filter "@symplek/*" --filter "create-symplek" run lint
      # Packages resolve each other's types through the built `dist/` output,
      # so a clean runner must build before it can type check.
      - name: Build packages
        run: pnpm --filter "@symplek/*" --filter "create-symplek" run build
      - name: Type check packages
        run: pnpm --filter "@symplek/*" --filter "create-symplek" run typecheck

  tier-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fail if @symplek/core imports @symplek/pro
        run: |
          # Match import forms only (static `from`, dynamic `import()`, `require()`),
          # not comments or prose: a grep for bare '@symplek/pro' false-positives on comment text.
          matches=$(grep -rEl "(from|import\(|require\()\s*['\"]@symplek/pro" packages/symplek-core/src --include='*.ts' || true)
          if [ -n "$matches" ]; then
            echo "Error: @symplek/core must not import @symplek/pro. Offending files:"
            echo "$matches"
            exit 1
          fi
          echo "OK: no @symplek/pro imports in packages/symplek-core/src"

  build:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm --filter "@symplek/*" --filter "create-symplek" run build
      - name: Check build artefacts present
        run: |
          for package in @symplek/core @symplek/convex @symplek/react @symplek/pro @symplek/mcp @symplek/harness @symplek/testing; do
            if [ ! -d "packages/$package/dist" ]; then
              echo "Error: packages/$package/dist not found"
              exit 1
            fi
          done
          # @symplek/cli builds via `tsc && copy-templates`; its entry is dist/index.js.
          if [ ! -f "packages/symplek-cli/dist/index.js" ]; then
            echo "Error: packages/symplek-cli/dist/index.js not found"
            exit 1
          fi
          # create-symplek builds to dist/index.js (CJS bundle).
          if [ ! -f "packages/create-symplek/dist/index.js" ]; then
            echo "Error: packages/create-symplek/dist/index.js not found"
            exit 1
          fi
          echo "OK: all published packages emitted their build artefacts"
      - name: Inspect every packed package
        # Packs each publishable package with `pnpm pack`, as `changeset publish`
        # does, and checks the tarball: no `workspace:` specifier left in the
        # packed package.json (pnpm rewrites it; a raw `npm publish` would not),
        # every main / types / exports / bin target is in the tarball, every bin
        # target parses, and a LICENSE file is included. Publishes nothing.
        run: node .github/scripts/check-packed-packages.mjs

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm --filter "@symplek/*" --filter "create-symplek" run build
      - name: Test packages
        run: pnpm --filter "@symplek/*" test

  # Gated publish via the changesets flow. Runs ONLY on push to main, after all
  # quality gates pass. On a normal push it opens/updates a "Version Packages" PR;
  # when that PR merges (consuming the changesets), it runs `release` and publishes.
  # GITHUB_TOKEN is auto-provided; NPM_TOKEN must be set as a repo secret for publish.
  release:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, tier-boundary, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create release PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
