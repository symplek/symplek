name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to least-privilege. Individual jobs can opt up if they need write
# access (e.g. publishing). Dependabot keeps the pinned action versions
# below current — see .github/dependabot.yml.
permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # No explicit version — action reads packageManager field from package.json
      # so CI always installs the exact pnpm revision the repo was tested with.
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint packages
        run: pnpm --filter "weft-*" --filter "create-weft" run lint
      # Each package's runtime VERSION constant must equal its package.json.
      # `pnpm version-packages` keeps them in step; this catches a hand edit.
      - name: Version constants match the manifests
        run: pnpm check:versions
      # Packages resolve each other's types through the built `dist/` output,
      # so a clean runner must build before it can type check.
      - name: Build packages
        run: pnpm --filter "weft-*" --filter "create-weft" run build
      - name: Type check packages
        run: pnpm --filter "weft-*" --filter "create-weft" run typecheck
      # Every import a README or doc shows must exist in the built packages.
      - name: Docs name only real exports
        run: pnpm check:docs

  tier-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fail if weft-core imports weft-pro
        run: |
          # Match import forms only, not comments or prose: `from "weft-pro"`,
          # a bare side-effect `import "weft-pro"`, dynamic `import("weft-pro")`
          # and `require("weft-pro")`. A grep for the bare name would
          # false-positive on comment text.
          matches=$(grep -rEl "(from|import|require)[[:space:]]*\(?[[:space:]]*['\"]weft-pro" packages/weft-core/src --include='*.ts' --include='*.tsx' || true)
          if [ -n "$matches" ]; then
            echo "Error: weft-core must not import weft-pro. Offending files:"
            echo "$matches"
            exit 1
          fi
          echo "OK: no weft-pro imports in packages/weft-core/src"

  build:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm --filter "weft-*" --filter "create-weft" run build
      # Packs every publishable package as `changeset publish` does, installs
      # the tarballs into a fresh project and loads each entry point by
      # `import` and `require`. This is the only check that sees the packages
      # the way a user receives them: the unit tests run against source.
      # Publishes nothing. See scripts/consumer-smoke.mjs for what it asserts.
      - name: Packed packages install and load for a consumer
        run: pnpm check:consumer
      # Scaffolds a project from each template with the built CLI, installs
      # it, and runs the project's own checks plus every CLI command the
      # scaffold tells the user to run. See scripts/scaffold-e2e.mjs.
      - name: Scaffolded projects work end to end
        run: pnpm check:scaffold

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm --filter "weft-*" --filter "create-weft" run build
      - name: Test packages
        run: pnpm --filter "weft-*" test

  # Gated publish via the changesets flow. Runs ONLY on push to main, after all
  # quality gates pass. On a normal push it opens/updates a "Version Packages" PR;
  # when that PR merges (consuming the changesets), it runs `release` and publishes.
  # GITHUB_TOKEN is auto-provided; NPM_TOKEN must be set as a repo secret for publish.
  release:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, tier-boundary, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create release PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
