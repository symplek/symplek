name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release job opens the "Version Packages" PR with GITHUB_TOKEN. GitHub
  # holds pull_request runs for PRs that token opens or updates until someone
  # with write access approves them; unapproved, the run gets no jobs and ends
  # as "failure" when the PR closes. workflow_dispatch runs start at once, so
  # the release job dispatches CI on the PR's branch to give the PR its checks.
  # The held run still appears. A GitHub App token on changesets/action would
  # remove it, and this trigger and the dispatch step with it.
  workflow_dispatch:

# Default to least-privilege. Individual jobs can opt up if they need write
# access (e.g. publishing). Dependabot keeps the pinned action versions
# below current — see .github/dependabot.yml.
permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # No explicit version — action reads packageManager field from package.json
      # so CI always installs the exact pnpm revision the repo was tested with.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint packages
        run: pnpm --filter "@symplek/*" --filter "create-symplek" run lint
      # Each package's runtime VERSION constant must equal its package.json.
      # `pnpm version-packages` keeps them in step; this catches a hand edit.
      - name: Version constants match the manifests
        run: pnpm check:versions
      # Packages resolve each other's types through the built `dist/` output,
      # so a clean runner must build before it can type check.
      - name: Build packages
        run: pnpm --filter "@symplek/*" --filter "create-symplek" run build
      - name: Type check packages
        run: pnpm --filter "@symplek/*" --filter "create-symplek" run typecheck
      # Every import a README or doc shows must exist in the built packages.
      - name: Docs name only real exports
        run: pnpm check:docs

  tier-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fail if @symplek/core imports @symplek/pro
        run: |
          # Match import forms only, not comments or prose: `from "@symplek/pro"`,
          # a bare side-effect `import "@symplek/pro"`, dynamic `import("@symplek/pro")`
          # and `require("@symplek/pro")`. A grep for the bare name would
          # false-positive on comment text.
          matches=$(grep -rEl "(from|import|require)[[:space:]]*\(?[[:space:]]*['\"]@symplek/pro" packages/symplek-core/src --include='*.ts' --include='*.tsx' || true)
          if [ -n "$matches" ]; then
            echo "Error: @symplek/core must not import @symplek/pro. Offending files:"
            echo "$matches"
            exit 1
          fi
          echo "OK: no @symplek/pro imports in packages/symplek-core/src"

  # lint-and-typecheck, tier-boundary, build and test share no outputs: each
  # job installs and builds for itself, so they run side by side. Only
  # release waits, on all four.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm --filter "@symplek/*" --filter "create-symplek" run build
      # Packs every publishable package as `changeset publish` does, installs
      # the tarballs into a fresh project and loads each entry point by
      # `import` and `require`. This is the only check that sees the packages
      # the way a user receives them: the unit tests run against source.
      # Publishes nothing. See scripts/consumer-smoke.mjs for what it asserts.
      - name: Packed packages install and load for a consumer
        run: pnpm check:consumer
      # Scaffolds a project from each template with the built CLI, installs
      # it, and runs the project's own checks plus every CLI command the
      # scaffold tells the user to run. See scripts/scaffold-e2e.mjs.
      - name: Scaffolded projects work end to end
        run: pnpm check:scaffold

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm --filter "@symplek/*" --filter "create-symplek" run build
      - name: Test packages
        run: pnpm --filter "@symplek/*" test

  # Gated publish via the changesets flow. Runs ONLY on push to main, after all
  # quality gates pass. On a normal push it opens/updates a "Version Packages" PR;
  # when that PR merges (consuming the changesets), it runs `release` and publishes.
  # GITHUB_TOKEN is auto-provided; NPM_TOKEN must be set as a repo secret for publish.
  # Opening the PR with GITHUB_TOKEN needs the repo setting "Allow GitHub Actions
  # to create and approve pull requests"; without it this job fails (run 40084529144).
  release:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, tier-boundary, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: write # dispatch CI onto the Version Packages PR branch
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      # Gives the Version Packages PR the same checks every other PR gets
      # (see the workflow_dispatch note at the top). The runs land on the PR's
      # head commit, so they show on the PR.
      - name: Run CI on the Version Packages PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          branch=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          echo "Dispatched CI on $branch for PR #$PR"
