# Keeps SHA-pinned GitHub Actions in .github/workflows/*.yml current.
# Without this file, the SHA pins in CI workflows freeze forever and miss
# upstream security patches. With it, Dependabot opens a PR whenever a
# pinned action publishes a new release — we review, test, and merge.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
